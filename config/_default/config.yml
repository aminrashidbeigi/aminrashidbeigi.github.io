baseURL: "https://aminrb.me/"
languageCode: "en-us"
title: "Amin Rashidbeigi"
theme: "PaperMod"
enableRobotsTXT: true

permalinks:
  posts: /:slug/

params:
  description: "Amin Rashidbeigi's personal website"
  author: Amin Rashidbeigi
  comments: false
  ShowToc: true
  defaultTheme: auto
  ShowShareButtons: false
  ShowReadingTime: true
  # disableSpecial1stPost: true
  displayFullLangName: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  images: ["og-cover.jpg"]
  cover:
    linkFullImages: true

  profileMode:
    enabled: false
    title: A software engineer!
    imageUrl: "avatar.png"
    imageTitle: my image
    imageWidth: 120
    imageHeight: 120
    buttons:
      - name: Posts
        url: posts
      - name: CSV
        url: amin-rashidbeigi-cv-feb2023.pdf
  homeInfoParams:
    Title: "Amin Rashidbeigi"
    Content: >
      Software engineer and former engineering manager in Berlin, on the
      [engineer/manager pendulum](https://charity.wtf/p/the-engineer-manager-pendulum).
      I write about building software and leading the teams that build it,
      and I mentor engineers through interviews, relocation and the step into leadership.
    Meta: "About ten years in engineering · SnappMarket, Divar, CHECK24, Delivery Hero"
    Buttons:
      - name: Join the next table talk
        url: table-talks/
        primary: true
      - name: Book a free intro call
        url: mentoring/#book
  socialIcons:
    - name: x
      url: "https://x.com/AminRashidbeigi"
    - name: linkedin
      url: "https://www.linkedin.com/in/amin-rashidbeigi"
    - name: github
      url: "https://github.com/aminrashidbeigi"
    # - name: medium
    # url: "https://medium.com/@amin.rashidbeigi"
    - name: stackoverflow
      url: "https://stackoverflow.com/users/5714900/amin-rashidbeigi"
    - name: goodreads
      url: "https://www.goodreads.com/user/show/47262588-amin-rashidbeigi"
    - name: telegram
      url: "https://t.me/aminrbg"
    # - name: cv
    #   url: "https://aminrb.me/amin-rashidbeigi-cv-feb2023.pdf"
  assets:
    disableHLJS: true
  mainSections: [posts]
  # Cloudflare Worker that stores table talk applications (see worker/README.md).
  applyEndpoint: "https://aminrb.me/api"
  # Set to a Turnstile site key to add a Turnstile check to the application form.
  turnstileSiteKey: ""

markup:
  highlight:
    # anchorLineNos: false
    # codeFences: true
    # guessSyntax: true
    # hl_Lines: ""
    # hl_inline: false
    # lineAnchors: ""
    # lineNoStart: 1
    # lineNos: false
    # lineNumbersInTable: true
    noClasses: false
    # noHl: false
    # style: monokai
    # tabWidth: 4
  goldmark:
    renderer:
      unsafe: true

languages:
  en:
    languageName: "English"
    weight: 1
    taxonomies:
      category: categories
      tag: tags
      series: series
    menu:
      main:
        - identifier: posts
          name: Writing
          pageRef: /posts
          weight: 1
        - identifier: table-talks
          name: Table Talks
          pageRef: /table-talks
          weight: 2
        - identifier: mentoring
          name: Mentoring
          pageRef: /mentoring
          weight: 3
        - identifier: about
          name: About
          pageRef: /about
          weight: 4
  fa:
    languageName: "فارسی"
    languagedirection: rtl
    weight: 2
    title: امین رشیدبیگی
    params:
      author: امین رشیدبیگی
      description: "صفحهٔ شخصی امین رشیدبیگی"
      profileMode:
        enabled: false
        title: یک مهندس نرم‌افزار!
        imageUrl: "avatar.png"
        imageTitle: my image
        imageWidth: 120
        imageHeight: 120
        buttons:
          - name: نوشته‌ها
            url: posts
          - name: رزومه
            url: amin-rashidbeigi-cv-feb2023.pdf
      homeInfoParams:
        Title: امین رشیدبیگی
        Content: >
          مهندس نرم‌افزار و مدیر مهندسی سابق، ساکن برلین. دربارهٔ ساختن نرم‌افزار و رهبری تیم‌های مهندسی
          می‌نویسم و به مهندس‌ها در مصاحبه، مهاجرت کاری و رسیدن به نقش‌های لیدرشیپ کمک می‌کنم.
        Meta: "حدود ده سال تجربهٔ مهندسی · اسنپ‌مارکت، دیوار، CHECK24، Delivery Hero"
        Buttons:
          - name: شرکت در میزگرد بعدی
            url: table-talks/
            primary: true
          - name: رزرو جلسهٔ آشنایی رایگان
            url: mentoring/#book
          - name: کانال تلگرام
            url: https://t.me/aminrbg
    taxonomies:
      category: categories
      tag: tags
      series: series
    menu:
      main:
        - identifier: posts
          name: نوشته‌ها
          pageRef: /posts
          weight: 1
        - identifier: table-talks
          name: میزگرد
          pageRef: /table-talks
          weight: 2
        - identifier: mentoring
          name: منتورینگ
          pageRef: /mentoring
          weight: 3
        - identifier: about
          name: دربارهٔ من
          pageRef: /about
          weight: 4
