  homeInfoParams:
    Title: "Hi there! 👋"
    Content: >
      I’m Amin, a software engineer navigating the joys and challenges of tech life. On this site, I share my thoughts on software engineering, team leadership, and everything in between.


      Curious to know more about me? Head over to my [about page](/about/), or check out the [side projects](/side-projects/) I’ve built along the way.


      If you’re a Persian reader, you can follow my [Telegram channel](https://t.me/aminrbg) for updates on new posts.


      And hey, I’d love to hear from you! Feel free to connect with me on [X](https://x.com/AminRashidbeigi) or [LinkedIn](https://www.linkedin.com/in/amin-rashidbeigi)—whether you have questions, ideas to share, or just want to say hi :)
