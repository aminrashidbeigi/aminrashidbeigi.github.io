      homeInfoParams:
        Title: سلام! 👋
        Content: >
          من امین هستم، مهندس نرم‌افزارم و به مشاهده، تحلیل و حل مشکلات نرم‌افزاری و ارتباطات انسانی حول مسئله علاقه‌مندم! اگر کنجکاوی که بیشتر دربارهٔ من بدونی به صفحهٔ [درباره‌ٔ من](about/) سر بزن یا [پروژه‌های جانبی](side-projects/) که در طول مسیر ساختم رو ببین.


          من در حال حاضر به صورت مرتب‌تر توی  [کانال تلگرامم](https://t.me/aminrbg) می‌نویسم و اگر به موضوعات اشاره‌شده علاقه‌مندی حتماً یه سر بهش بزن.


          اگر هم می‌خوای در مورد موضوعی گپ بزنیم، ایده‌ای رو باهام به اشتراک بذاری یا صرفاً با هم بیشتر آشنا شیم، [اینجا](ways-i-can-help/) لینک تقویم و زمان‌های خالیم رو پیدا می‌کنی و می‌تونیم با هم گفت‌و‌گو کنیم، یا این که بهم ایمیل بزن.
