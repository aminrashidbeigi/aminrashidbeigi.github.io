# Mentoring offers, rendered by the `offers` shortcode in both languages.
# While draft_prices is true, paid offers show "price on request" instead of the number,
# except offers marked price_confirmed: true.
draft_prices: true # every paid offer is price_confirmed now; kept for future offers
offers:
  - id: intro
    free: true
    cal: "aminrb/intro"            # TODO(amin): confirm cal.com event slug
    en: { name: "Intro call", price: "Free", detail: "20 minutes, once per person, to agree a plan. Not a mentoring session.", note: "20 minutes, once per person, to agree a plan. Not a mentoring session." }
    fa: { name: "جلسهٔ اولیه", price: "رایگان", detail: "۲۰ دقیقه برای این‌که با هم برنامهٔ کار رو بچینیم." }
  - id: single
    cal: "aminrb/mentoring"
    price_confirmed: true          # €49.90 on cal.com
    en: { name: "Single session", price: "€49.90", detail: "60 minutes plus written next steps. For a one-off question, a CV review, or a hard conversation with your manager." }
    fa: { name: "تک‌جلسه", price: "۴۹٫۹۰ یورو", detail: "۶۰ دقیقه به‌همراه جمع‌بندی مکتوب قدم‌های بعدی. برای یک سؤال مشخص، بررسی رزومه یا یک گفت‌وگوی سخت با مدیرت." }
  - id: interview-prep
    price_confirmed: true
    en: { name: "Interview prep", was: "€49.90", price: "€34.90 per session", discount: "30% off", detail: "A package of three interview prep sessions with mock interviews and feedback: recruiter, technical or system design, and behavioural." }
    fa: { name: "آمادگی مصاحبه", was: "۴۹٫۹۰ یورو", price: "۳۴٫۹۰ یورو برای هر جلسه", discount: "۳۰٪ تخفیف", detail: "بستهٔ سه جلسه‌ای آمادگی مصاحبه، با مصاحبهٔ آزمایشی و بازخورد: ریکروتر، فنی یا طراحی سیستم، و رفتاری." }
  - id: ongoing
    price_confirmed: true
    en: { name: "Ongoing mentoring", was: "€49.90", price: "€29.90 per session", discount: "40% off", detail: "At least 4 sessions, usually one every three weeks; we set the pace around your goal. For growing in your role, working with your manager, moving into management or working abroad." }
    fa: { name: "منتورینگ دوره‌ای", was: "۴۹٫۹۰ یورو", price: "۲۹٫۹۰ یورو برای هر جلسه", discount: "۴۰٪ تخفیف", detail: "دست‌کم ۴ جلسه، معمولاً هر سه هفته یک بار؛ فاصلهٔ جلسه‌ها رو بر اساس هدفت تنظیم می‌کنیم. برای رشد در نقشت، کار با مدیرت، رفتن به سمت مدیریت یا کار در کشور دیگه." }
