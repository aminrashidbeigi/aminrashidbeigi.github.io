{{- /* Table talk application form. Context: the session page. Posts to the Worker. */ -}}
{{- $full := eq .Params.status "full" }}
<section class="apply" id="apply">
  <p class="apply-note"{{ if not $full }} hidden{{ end }}>{{ i18n "talk_full" }}</p>
  <p class="apply-error" role="alert" hidden
    data-invalid="{{ i18n "apply_error" }}" data-closed="{{ i18n "apply_error_closed" }}"
    data-duplicate="{{ i18n "apply_error_duplicate" }}"></p>
  <form action="{{ site.Params.applyEndpoint }}/apply" method="post" class="apply-form">
    <input type="hidden" name="talk" value="{{ .File.ContentBaseName }}">
    <input type="hidden" name="lang" value="{{ .Lang }}">
    <label><span>{{ i18n "apply_email" }}</span> <input name="email" type="email" maxlength="120" required dir="ltr" autocomplete="email"></label>
    <label><span>{{ i18n "apply_name" }} <span class="optional">{{ i18n "optional" }}</span></span> <input name="name" maxlength="80" autocomplete="name"></label>
    <label><span>{{ i18n "apply_role" }} <span class="optional">{{ i18n "optional" }}</span></span> <input name="role" maxlength="80"></label>
    <label><span>{{ i18n "apply_workplace" }} <span class="optional">{{ i18n "optional" }}</span></span> <input name="workplace" maxlength="100"></label>
    <label><span>{{ i18n "apply_experience" }} <span class="optional">{{ i18n "optional" }}</span></span>
      <select name="experience">
        <option value="">{{ i18n "apply_choose" }}</option>
        {{- range slice "0-2" "3-5" "6-10" "10+" }}
        <option value="{{ . }}">{{ i18n (printf "apply_experience_%s" (replace . "+" "plus")) }}</option>
        {{- end }}
      </select>
    </label>
    <input name="website" tabindex="-1" autocomplete="off" aria-hidden="true" hidden>
    {{- with site.Params.turnstileSiteKey }}
    <div class="cf-turnstile" data-sitekey="{{ . }}"></div>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    {{- end }}
    <p class="apply-privacy">{{ i18n "apply_privacy" }}</p>
    <button type="submit" class="btn btn-primary" data-waitlist="{{ i18n "apply_waitlist_submit" }}">
      {{- if $full }}{{ i18n "apply_waitlist_submit" }}{{ else }}{{ i18n "apply_submit" }}{{ end -}}
    </button>
  </form>
</section>
<script>
  (function () {
    var err = new URLSearchParams(location.search).get("error");
    var box = document.querySelector(".apply-error");
    if (err && box) {
      box.textContent = box.dataset[err === "closed" || err === "duplicate" ? err : "invalid"];
      box.hidden = false;
    }
    var seats = document.querySelector(".talk-seats-taken");
    if (!seats || !window.fetch) return;
    fetch(seats.dataset.endpoint).then(function (r) { return r.ok ? r.json() : Promise.reject(); }).then(function (d) {
      if (typeof d.confirmed !== "number") return;
      var num = function (n) { return seats.dataset.lang === "fa" ? n.toLocaleString("fa-IR") : String(n); };
      // "7 of 7 seats taken · 2 on the waitlist" replaces the static "7 seats".
      seats.textContent = seats.dataset.template.replace("%n", num(d.confirmed)).replace("%s", num(Number(seats.dataset.seats)));
      if (d.waitlist > 0) {
        var waiting = document.createElement("span");
        waiting.className = "talk-seats-waitlist";
        waiting.textContent = seats.dataset.waitlist.replace("%n", num(d.waitlist));
        seats.appendChild(waiting);
      }
      document.querySelector(".talk-seats-total").hidden = true;
      seats.hidden = false;
      // Every seat confirmed: new applicants go to the waitlist, so say so before they submit.
      if (d.confirmed >= Number(seats.dataset.seats)) {
        var button = document.querySelector(".apply-form button[type=submit]");
        document.querySelector(".apply-note").hidden = false;
        if (button) button.textContent = button.dataset.waitlist;
      }
    }).catch(function () {});
  })();
</script>
